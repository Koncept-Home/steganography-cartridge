<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steganography Cartridge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #24292e;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background: #0d1117;
            color: #c9d1d9;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 16px;
        }

        body.dark-mode header {
            border-bottom-color: #30363d;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        body.dark-mode .theme-toggle {
            border-color: #30363d;
        }

        .theme-toggle:hover {
            background-color: #f6f8fa;
        }

        body.dark-mode .theme-toggle:hover {
            background-color: #161b22;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        .upload-area {
            border: 2px dashed #e1e4e8;
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #f6f8fa;
        }

        body.dark-mode .upload-area {
            border-color: #30363d;
            background: #0d1117;
        }

        .upload-area:hover {
            border-color: #1f6feb;
            background: #f0f6fc;
        }

        body.dark-mode .upload-area:hover {
            border-color: #58a6ff;
            background: #0d1117;
        }

        .upload-area.dragover {
            border-color: #1f6feb;
            background: #f0f6fc;
        }

        body.dark-mode .upload-area.dragover {
            border-color: #58a6ff;
            background: #161b22;
        }

        .upload-text {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .upload-subtext {
            font-size: 12px;
            opacity: 0.6;
        }

        input[type="file"] {
            display: none;
        }

        .file-item {
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        body.dark-mode .file-item {
            background: #161b22;
            border-color: #30363d;
        }

        .file-name {
            flex: 1;
            word-break: break-all;
            margin-right: 12px;
        }

        .file-size {
            opacity: 0.6;
            white-space: nowrap;
            font-size: 12px;
            margin-right: 12px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #d1242f;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: opacity 0.2s;
        }

        .remove-btn:hover {
            opacity: 0.7;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="range"],
        select {
            padding: 8px 12px;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            background: #ffffff;
            color: #24292e;
            transition: border-color 0.2s;
        }

        body.dark-mode input[type="text"],
        body.dark-mode select {
            background: #0d1117;
            color: #c9d1d9;
            border-color: #30363d;
        }

        input[type="text"]:focus,
        input[type="range"]:focus,
        select:focus {
            outline: none;
            border-color: #1f6feb;
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.1);
        }

        body.dark-mode input[type="text"]:focus,
        body.dark-mode select:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            padding: 8px 16px;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: #f6f8fa;
            color: #24292e;
        }

        body.dark-mode button {
            background: #161b22;
            color: #c9d1d9;
            border-color: #30363d;
        }

        button:hover:not(:disabled) {
            background-color: #f3f6f8;
            border-color: #d1d9e0;
        }

        body.dark-mode button:hover:not(:disabled) {
            background-color: #0d1117;
            border-color: #58a6ff;
        }

        .btn-primary {
            background: #1f6feb;
            color: #ffffff;
            border-color: #1f6feb;
        }

        .btn-primary:hover:not(:disabled) {
            background: #388bfd;
            border-color: #388bfd;
        }

        .btn-primary:disabled {
            background: #8c959f;
            border-color: #8c959f;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-success {
            background: #2ea043;
            color: #ffffff;
            border-color: #2ea043;
        }

        .btn-success:hover:not(:disabled) {
            background: #26843b;
            border-color: #26843b;
        }

        .btn-success:disabled {
            background: #8c959f;
            border-color: #8c959f;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e1e4e8;
            border-radius: 2px;
            overflow: hidden;
        }

        body.dark-mode .progress-bar {
            background: #30363d;
        }

        .progress-fill {
            height: 100%;
            background: #1f6feb;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            border: 1px solid;
            display: flex;
            gap: 8px;
            align-items: flex-start;
            animation: fadeIn 0.3s ease-in;
        }

        .alert-success {
            background: #f0f6fc;
            border-color: #1f6feb;
            color: #0969da;
        }

        body.dark-mode .alert-success {
            background: #0d1117;
            border-color: #58a6ff;
            color: #79c0ff;
        }

        .alert-error {
            background: #ffebe9;
            border-color: #da3633;
            color: #82071e;
        }

        body.dark-mode .alert-error {
            background: #0d1117;
            border-color: #f85149;
            color: #f85149;
        }

        .alert-warning {
            background: #fff8c5;
            border-color: #d29922;
            color: #7d4e00;
        }

        body.dark-mode .alert-warning {
            background: #0d1117;
            border-color: #d29922;
            color: #d29922;
        }

        .range-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .range-display {
            font-size: 12px;
            font-weight: 500;
            background: #f6f8fa;
            padding: 4px 8px;
            border-radius: 4px;
        }

        body.dark-mode .range-display {
            background: #161b22;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .stat {
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 12px;
        }

        body.dark-mode .stat {
            background: #161b22;
            border-color: #30363d;
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            word-break: break-all;
        }

        .divider {
            height: 1px;
            background: #e1e4e8;
            margin: 24px 0;
        }

        body.dark-mode .divider {
            background: #30363d;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .extractor-section {
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }

        body.dark-mode .extractor-section {
            background: #161b22;
            border-color: #30363d;
        }

        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 8px;
        }

        body.dark-mode .tab-buttons {
            border-bottom-color: #30363d;
        }

        .tab-btn {
            padding: 8px 12px;
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: #57606a;
            border-bottom: 2px solid transparent;
            margin-bottom: -8px;
            transition: all 0.2s;
        }

        body.dark-mode .tab-btn {
            color: #8b949e;
        }

        .tab-btn.active {
            color: #1f6feb;
            border-bottom-color: #1f6feb;
        }

        body.dark-mode .tab-btn.active {
            color: #58a6ff;
            border-bottom-color: #58a6ff;
        }

        .hidden-section {
            display: none;
        }

        .code-block {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #c9d1d9;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        .copy-btn {
            margin-top: 8px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Steganography Cartridge</div>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">Light/Dark</button>
        </header>

        <div class="content">
            <!-- Encoder Section -->
            <div class="section">
                <div class="section-title">Encode</div>

                <!-- Data File Upload -->
                <div class="input-group">
                    <label>Data File (to embed)</label>
                    <div class="upload-area" id="dataUploadArea">
                        <div class="upload-text">Choose file or drag here</div>
                        <div class="upload-subtext">Any file type supported</div>
                    </div>
                    <input type="file" id="dataFileInput" />
                    <div id="dataFileDisplay"></div>
                </div>

                <!-- Cover Image Upload -->
                <div class="input-group">
                    <label>Cover Image (PNG)</label>
                    <div class="upload-area" id="coverUploadArea">
                        <div class="upload-text">Choose image or drag here</div>
                        <div class="upload-subtext">PNG format recommended</div>
                    </div>
                    <input type="file" id="coverFileInput" accept="image/*" />
                    <div id="coverFileDisplay"></div>
                </div>

                <!-- Compression Level -->
                <div class="input-group">
                    <label>Compression Level</label>
                    <input type="range" id="compressionLevel" min="0" max="9" value="6" />
                    <div class="range-value">
                        <span>0 (none)</span>
                        <span class="range-display" id="compressionDisplay">6</span>
                        <span>9 (max)</span>
                    </div>
                </div>

                <!-- Stats -->
                <div class="stats" id="encoderStats" style="display: none;">
                    <div class="stat">
                        <div class="stat-label">Data Size</div>
                        <div class="stat-value" id="dataSizeStat">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Image Capacity</div>
                        <div class="stat-value" id="capacityStat">-</div>
                    </div>
                </div>

                <!-- Encode Button -->
                <div class="button-group">
                    <button class="btn-primary" id="encodeBtn" disabled>Encode & Generate</button>
                </div>

                <!-- Progress -->
                <div id="encodeProgress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="encodeProgressFill"></div>
                    </div>
                    <div class="progress-text" id="encodeProgressText">0%</div>
                </div>

                <!-- Messages -->
                <div id="encodeMessages"></div>
            </div>

            <!-- Decoder Section -->
            <div class="section">
                <div class="section-title">Decode</div>

                <!-- Stego Image Upload -->
                <div class="input-group">
                    <label>Steganographic PNG</label>
                    <div class="upload-area" id="stegoUploadArea">
                        <div class="upload-text">Choose image or drag here</div>
                        <div class="upload-subtext">PNG with hidden data</div>
                    </div>
                    <input type="file" id="stegoFileInput" accept="image/png" />
                    <div id="stegoFileDisplay"></div>
                </div>

                <!-- Decode Button -->
                <div class="button-group">
                    <button class="btn-primary" id="decodeBtn" disabled>Decode</button>
                </div>

                <!-- Progress -->
                <div id="decodeProgress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="decodeProgressFill"></div>
                    </div>
                    <div class="progress-text" id="decodeProgressText">0%</div>
                </div>

                <!-- Messages -->
                <div id="decodeMessages"></div>

                <!-- Extractor Tabs -->
                <div id="extractorContainer" style="display: none;">
                    <div class="divider"></div>
                    <div class="extractor-section">
                        <div class="tab-buttons">
                            <button class="tab-btn active" data-tab="info">Info</button>
                            <button class="tab-btn" data-tab="inject">Inject & Run</button>
                            <button class="tab-btn" data-tab="download">Download</button>
                        </div>

                        <!-- Info Tab -->
                        <div id="info-tab" class="tab-content">
                            <div class="stats">
                                <div class="stat">
                                    <div class="stat-label">File Name</div>
                                    <div class="stat-value" id="extractedFileName">-</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-label">File Size</div>
                                    <div class="stat-value" id="extractedFileSize">-</div>
                                </div>
                            </div>
                        </div>

                        <!-- Inject Tab -->
                        <div id="inject-tab" class="tab-content hidden-section">
                            <div class="input-group">
                                <label>Target Page</label>
                                <select id="injectTarget">
                                    <option value="new">Open in new window</option>
                                    <option value="blank">Open in about:blank</option>
                                    <option value="current">Replace current page</option>
                                </select>
                            </div>
                            <button class="btn-success" id="injectBtn">Inject & Execute</button>
                            <div id="injectMessages"></div>
                        </div>

                        <!-- Download Tab -->
                        <div id="download-tab" class="tab-content hidden-section">
                            <button class="btn-primary" id="downloadBtn" style="width: 100%;">Download File</button>
                            <div id="downloadMessages"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Steganography Engine - Standalone
        class SteganographyEngine {
            static formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
            }

            static async compressData(data, level) {
                // Simulate compression - in production, use pako or similar
                return data;
            }

            static async encode(dataArray, coverImage, compressionLevel, onProgress) {
                return new Promise((resolve, reject) => {
                    setTimeout(async () => {
                        try {
                            const canvas = document.createElement('canvas');
                            const img = new Image();
                            
                            img.onload = async () => {
                                canvas.width = img.width;
                                canvas.height = img.height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0);
                                
                                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                const data = imageData.data;
                                
                                // Calculate capacity (1 bit per channel, 4 channels per pixel)
                                const capacity = Math.floor((data.length / 4) / 8);
                                
                                if (dataArray.length > capacity) {
                                    reject(new Error(`Data too large. Max: ${SteganographyEngine.formatBytes(capacity)}, Got: ${SteganographyEngine.formatBytes(dataArray.length)}`));
                                    return;
                                }
                                
                                onProgress(10);
                                
                                // Embed metadata (4 bytes for file size)
                                const metadata = new Uint8Array(4);
                                const view = new DataView(metadata.buffer);
                                view.setUint32(0, dataArray.length, true);
                                
                                const fullData = new Uint8Array(metadata.length + dataArray.length);
                                fullData.set(metadata);
                                fullData.set(dataArray, metadata.length);
                                
                                onProgress(20);
                                
                                // LSB encoding
                                let bitIndex = 0;
                                for (let i = 0; i < fullData.length; i++) {
                                    const byte = fullData[i];
                                    for (let j = 0; j < 8; j++) {
                                        const bit = (byte >> j) & 1;
                                        const pixelIndex = Math.floor(bitIndex / 4);
                                        const channelIndex = bitIndex % 4;
                                        
                                        if (pixelIndex * 4 + channelIndex < data.length) {
                                            data[pixelIndex * 4 + channelIndex] = 
                                                (data[pixelIndex * 4 + channelIndex] & 0xFE) | bit;
                                        }
                                        bitIndex++;
                                    }
                                    if (i % 100 === 0) {
                                        onProgress(20 + (i / fullData.length) * 70);
                                    }
                                }
                                
                                onProgress(90);
                                
                                ctx.putImageData(imageData, 0, 0);
                                canvas.toBlob((blob) => {
                                    onProgress(100);
                                    resolve(blob);
                                }, 'image/png');
                            };
                            
                            img.onerror = () => reject(new Error('Failed to load cover image'));
                            img.src = URL.createObjectURL(coverImage);
                        } catch (error) {
                            reject(error);
                        }
                    }, 100);
                });
            }

            static async decode(stegoImage, onProgress) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        try {
                            const canvas = document.createElement('canvas');
                            const img = new Image();
                            
                            img.onload = () => {
                                canvas.width = img.width;
                                canvas.height = img.height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0);
                                
                                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                const data = imageData.data;
                                
                                onProgress(10);
                                
                                // Extract metadata (4 bytes for file size)
                                const metadata = new Uint8Array(4);
                                let bitIndex = 0;
                                
                                for (let i = 0; i < metadata.length; i++) {
                                    let byte = 0;
                                    for (let j = 0; j < 8; j++) {
                                        const pixelIndex = Math.floor(bitIndex / 4);
                                        const channelIndex = bitIndex % 4;
                                        
                                        if (pixelIndex * 4 + channelIndex < data.length) {
                                            const bit = data[pixelIndex * 4 + channelIndex] & 1;
                                            byte |= (bit << j);
                                        }
                                        bitIndex++;
                                    }
                                    metadata[i] = byte;
                                }
                                
                                const view = new DataView(metadata.buffer);
                                const fileSize = view.getUint32(0, true);
                                
                                if (fileSize === 0 || fileSize > data.length) {
                                    reject(new Error('Invalid or corrupted steganographic image'));
                                    return;
                                }
                                
                                onProgress(20);
                                
                                // Extract data
                                const extractedData = new Uint8Array(fileSize);
                                for (let i = 0; i < fileSize; i++) {
                                    let byte = 0;
                                    for (let j = 0; j < 8; j++) {
                                        const pixelIndex = Math.floor(bitIndex / 4);
                                        const channelIndex = bitIndex % 4;
                                        
                                        if (pixelIndex * 4 + channelIndex < data.length) {
                                            const bit = data[pixelIndex * 4 + channelIndex] & 1;
                                            byte |= (bit << j);
                                        }
                                        bitIndex++;
                                    }
                                    extractedData[i] = byte;
                                    if (i % 1000 === 0) {
                                        onProgress(20 + (i / fileSize) * 75);
                                    }
                                }
                                
                                onProgress(100);
                                resolve(extractedData);
                            };
                            
                            img.onerror = () => reject(new Error('Failed to load steganographic image'));
                            img.src = URL.createObjectURL(stegoImage);
                        } catch (error) {
                            reject(error);
                        }
                    }, 100);
                });
            }
        }

        // UI Controller
        class UIController {
            constructor() {
                this.dataFile = null;
                this.coverImage = null;
                this.stegoImage = null;
                this.extractedData = null;
                this.extractedFileName = null;
                
                this.initTheme();
                this.initEventListeners();
            }

            initTheme() {
                const theme = localStorage.getItem('theme') || 'light';
                if (theme === 'dark') {
                    document.body.classList.add('dark-mode');
                    document.getElementById('themeToggle').textContent = 'Light';
                }
                
                document.getElementById('themeToggle').addEventListener('click', () => {
                    document.body.classList.toggle('dark-mode');
                    const isDark = document.body.classList.contains('dark-mode');
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');
                    document.getElementById('themeToggle').textContent = isDark ? 'Light' : 'Dark';
                });
            }

            initEventListeners() {
                // Data file upload
                document.getElementById('dataUploadArea').addEventListener('click', () => {
                    document.getElementById('dataFileInput').click();
                });
                
                document.getElementById('dataFileInput').addEventListener('change', (e) => {
                    this.handleDataFileSelect(e.target.files[0]);
                });
                
                // Cover image upload
                document.getElementById('coverUploadArea').addEventListener('click', () => {
                    document.getElementById('coverFileInput').click();
                });
                
                document.getElementById('coverFileInput').addEventListener('change', (e) => {
                    this.handleCoverImageSelect(e.target.files[0]);
                });
                
                // Stego image upload
                document.getElementById('stegoUploadArea').addEventListener('click', () => {
                    document.getElementById('stegoFileInput').click();
                });
                
                document.getElementById('stegoFileInput').addEventListener('change', (e) => {
                    this.handleStegoImageSelect(e.target.files[0]);
                });
                
                // Drag and drop
                this.setupDragDrop('dataUploadArea', 'dataFileInput');
                this.setupDragDrop('coverUploadArea', 'coverFileInput');
                this.setupDragDrop('stegoUploadArea', 'stegoFileInput');
                
                // Compression level
                document.getElementById('compressionLevel').addEventListener('input', (e) => {
                    document.getElementById('compressionDisplay').textContent = e.target.value;
                });
                
                // Encode button
                document.getElementById('encodeBtn').addEventListener('click', () => this.encode());
                
                // Decode button
                document.getElementById('decodeBtn').addEventListener('click', () => this.decode());
                
                // Download button
                document.getElementById('downloadBtn').addEventListener('click', () => this.download());
                
                // Inject button
                document.getElementById('injectBtn').addEventListener('click', () => this.inject());
                
                // Tab buttons
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.switchTab(e.target.dataset.tab));
                });
            }

            setupDragDrop(areaId, inputId) {
                const area = document.getElementById(areaId);
                
                area.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    area.classList.add('dragover');
                });
                
                area.addEventListener('dragleave', () => {
                    area.classList.remove('dragover');
                });
                
                area.addEventListener('drop', (e) => {
                    e.preventDefault();
                    area.classList.remove('dragover');
                    
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        document.getElementById(inputId).files = files;
                        
                        if (inputId === 'dataFileInput') {
                            this.handleDataFileSelect(files[0]);
                        } else if (inputId === 'coverFileInput') {
                            this.handleCoverImageSelect(files[0]);
                        } else if (inputId === 'stegoFileInput') {
                            this.handleStegoImageSelect(files[0]);
                        }
                    }
                });
            }

            handleDataFileSelect(file) {
                if (!file) return;
                
                this.dataFile = file;
                const display = document.getElementById('dataFileDisplay');
                display.innerHTML = `
                    <div class="file-item">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${SteganographyEngine.formatBytes(file.size)}</span>
                        <button class="remove-btn" onclick="document.querySelector('[data-controller]').clearDataFile()">Remove</button>
                    </div>
                `;
                
                this.updateEncoderStats();
                this.validateEncodeInputs();
            }

            handleCoverImageSelect(file) {
                if (!file) return;
                
                this.coverImage = file;
                const display = document.getElementById('coverFileDisplay');
                display.innerHTML = `
                    <div class="file-item">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${SteganographyEngine.formatBytes(file.size)}</span>
                        <button class="remove-btn" onclick="document.querySelector('[data-controller]').clearCoverImage()">Remove</button>
                    </div>
                `;
                
                this.updateEncoderStats();
                this.validateEncodeInputs();
            }

            handleStegoImageSelect(file) {
                if (!file) return;
                
                this.stegoImage = file;
                const display = document.getElementById('stegoFileDisplay');
                display.innerHTML = `
                    <div class="file-item">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${SteganographyEngine.formatBytes(file.size)}</span>
                        <button class="remove-btn" onclick="document.querySelector('[data-controller]').clearStegoImage()">Remove</button>
                    </div>
                `;
                
                document.getElementById('decodeBtn').disabled = false;
            }

            clearDataFile() {
                this.dataFile = null;
                document.getElementById('dataFileDisplay').innerHTML = '';
                document.getElementById('encoderStats').style.display = 'none';
                this.validateEncodeInputs();
            }

            clearCoverImage() {
                this.coverImage = null;
                document.getElementById('coverFileDisplay').innerHTML = '';
                document.getElementById('encoderStats').style.display = 'none';
                this.validateEncodeInputs();
            }

            clearStegoImage() {
                this.stegoImage = null;
                this.extractedData = null;
                this.extractedFileName = null;
                document.getElementById('stegoFileDisplay').innerHTML = '';
                document.getElementById('extractorContainer').style.display = 'none';
                document.getElementById('decodeBtn').disabled = true;
            }

            async updateEncoderStats() {
                if (!this.dataFile || !this.coverImage) return;
                
                const canvas = document.createElement('canvas');
                const img = new Image();
                
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const capacity = Math.floor((imageData.data.length / 4) / 8);
                    
                    document.getElementById('dataSizeStat').textContent = SteganographyEngine.formatBytes(this.dataFile.size);
                    document.getElementById('capacityStat').textContent = SteganographyEngine.formatBytes(capacity);
                    document.getElementById('encoderStats').style.display = 'grid';
                };
                
                img.src = URL.createObjectURL(this.coverImage);
            }

            validateEncodeInputs() {
                document.getElementById('encodeBtn').disabled = !(this.dataFile && this.coverImage);
            }

            async encode() {
                const btn = document.getElementById('encodeBtn');
                btn.disabled = true;
                
                const messagesDiv = document.getElementById('encodeMessages');
                messagesDiv.innerHTML = '';
                
                const progressDiv = document.getElementById('encodeProgress');
                progressDiv.style.display = 'block';
                
                try {
                    const dataArray = new Uint8Array(await this.dataFile.arrayBuffer());
                    const compressionLevel = parseInt(document.getElementById('compressionLevel').value);
                    
                    const blob = await SteganographyEngine.encode(
                        dataArray,
                        this.coverImage,
                        compressionLevel,
                        (progress) => {
                            const fill = document.getElementById('encodeProgressFill');
                            fill.style.width = progress + '%';
                            document.getElementById('encodeProgressText').textContent = Math.round(progress) + '%';
                        }
                    );
                    
                    // Download the file
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'stego.png';
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    messagesDiv.innerHTML = `
                        <div class="alert alert-success">
                            <span>File encoded successfully! Download started.</span>
                        </div>
                    `;
                    
                    progressDiv.style.display = 'none';
                } catch (error) {
                    messagesDiv.innerHTML = `
                        <div class="alert alert-error">
                            <span>${error.message}</span>
                        </div>
                    `;
                    progressDiv.style.display = 'none';
                } finally {
                    btn.disabled = false;
                }
            }

            async decode() {
                const btn = document.getElementById('decodeBtn');
                btn.disabled = true;
                
                const messagesDiv = document.getElementById('decodeMessages');
                messagesDiv.innerHTML = '';
                
                const progressDiv = document.getElementById('decodeProgress');
                progressDiv.style.display = 'block';
                
                try {
                    this.extractedData = await SteganographyEngine.decode(
                        this.stegoImage,
                        (progress) => {
                            const fill = document.getElementById('decodeProgressFill');
                            fill.style.width = progress + '%';
                            document.getElementById('decodeProgressText').textContent = Math.round(progress) + '%';
                        }
                    );
                    
                    // Try to extract filename from metadata if it exists
                    this.extractedFileName = 'extracted_file';
                    
                    messagesDiv.innerHTML = `
                        <div class="alert alert-success">
                            <span>File decoded successfully!</span>
                        </div>
                    `;
                    
                    this.showExtractorContainer();
                    progressDiv.style.display = 'none';
                } catch (error) {
                    messagesDiv.innerHTML = `
                        <div class="alert alert-error">
                            <span>${error.message}</span>
                        </div>
                    `;
                    progressDiv.style.display = 'none';
                } finally {
                    btn.disabled = false;
                }
            }

            showExtractorContainer() {
                document.getElementById('extractorContainer').style.display = 'block';
                document.getElementById('extractedFileName').textContent = this.extractedFileName;
                document.getElementById('extractedFileSize').textContent = SteganographyEngine.formatBytes(this.extractedData.length);
            }

            switchTab(tabName) {
                document.querySelectorAll('.tab-content').forEach(tab => {
                    tab.classList.add('hidden-section');
                });
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                
                document.getElementById(tabName + '-tab').classList.remove('hidden-section');
                document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            }

            download() {
                if (!this.extractedData) return;
                
                const blob = new Blob([this.extractedData]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = this.extractedFileName;
                a.click();
                URL.revokeObjectURL(url);
                
                const messagesDiv = document.getElementById('downloadMessages');
                messagesDiv.innerHTML = `
                    <div class="alert alert-success" style="margin-top: 12px;">
                        <span>File downloaded successfully!</span>
                    </div>
                `;
            }

            inject() {
                if (!this.extractedData) return;
                
                const messagesDiv = document.getElementById('injectMessages');
                const target = document.getElementById('injectTarget').value;
                
                try {
                    // Try to detect if it's HTML content
                    const dataStr = new TextDecoder().decode(this.extractedData);
                    
                    if (dataStr.includes('<!') || dataStr.includes('<html') || dataStr.includes('<body')) {
                        // It's HTML
                        if (target === 'blank') {
                            const newWindow = window.open('about:blank');
                            newWindow.document.write(dataStr);
                            newWindow.document.close();
                        } else if (target === 'new') {
                            const blob = new Blob([this.extractedData], { type: 'text/html' });
                            const url = URL.createObjectURL(blob);
                            window.open(url);
                        } else if (target === 'current') {
                            document.open();
                            document.write(dataStr);
                            document.close();
                        }
                        
                        messagesDiv.innerHTML = `
                            <div class="alert alert-success" style="margin-top: 12px;">
                                <span>HTML injected and executed successfully!</span>
                            </div>
                        `;
                    } else if (dataStr.includes('function ') || dataStr.includes('const ') || dataStr.includes('var ')) {
                        // It's JavaScript
                        eval(dataStr);
                        messagesDiv.innerHTML = `
                            <div class="alert alert-success" style="margin-top: 12px;">
                                <span>JavaScript executed successfully!</span>
                            </div>
                        `;
                    } else {
                        messagesDiv.innerHTML = `
                            <div class="alert alert-warning" style="margin-top: 12px;">
                                <span>File type could not be detected. Attempting to execute as JavaScript...</span>
                            </div>
                        `;
                    }
                } catch (error) {
                    messagesDiv.innerHTML = `
                        <div class="alert alert-error" style="margin-top: 12px;">
                            <span>Error: ${error.message}</span>
                        </div>
                    `;
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const controller = new UIController();
            document.documentElement.setAttribute('data-controller', '');
            window.uiController = controller;
        });
    </script>
</body>
</html>
